<h2 mat-dialog-title>Elegí una plantilla</h2>

<mat-dialog-content>
  <mat-nav-list>
    <a mat-list-item (click)="choose(null)">
      <span matListItemTitle>Sin plantilla</span>
      <span matListItemLine>Abrir WhatsApp sin mensaje precargado</span>
    </a>
    @for (template of templates(); track template.id) {
      <a mat-list-item (click)="choose(template)">
        <span matListItemTitle>{{ template.name }}</span>
        <span matListItemLine>{{ template.body }}</span>
      </a>
    }
  </mat-nav-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
